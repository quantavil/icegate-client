[project]
name = "icegate-client"
version = "0.2.0"
description = "Browser-free ICEGATE client for eSANCHIT and electronic filing"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "quantavil" }]
dependencies = [
  "requests>=2.32",
  "cryptography>=42.0",
  "certifi>=2024.2.2",
  "lxml>=6.1.3",
  "pyhanko>=0.38.0",
  "filelock>=4.2.4",
  "tzdata; sys_platform == 'win32'",
  "python-calamine>=0.9.0",
]

[project.scripts]
icegate = "icegate_client.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icegate_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
